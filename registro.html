<!-- Reemplace la sección <script> de su registro.html con esta versión de compatibilidad -->
<script>
// El resto del HTML y estilos se mantienen exactamente igual. Solo reemplace esta sección.
const GAS_URL = "https://script.google.com/macros/s/AKfycbxZ4qwyvvuWd_IfedsWR1R65niSwlYPKtgcDU_e5f0H4P1cCbOvIGDICksXe3tIdDrfrw/exec";
const PASSWORD_CORRECTA = "Apm2026";
const SESSION_KEY = "iqbf_agent_persistent_session";

let puestoActual = null;
let bolsonesSeleccionados = 0;
let productosSeleccionados = [];
let fotosList = [];
let conductorSeleccionado = null;

let productosDisponibles = [];
let conductoresDisponibles = [];
let localHistorial = JSON.parse(localStorage.getItem('iqbf_historial_agente') || '[]');

window.onload = () => {
  if (localStorage.getItem(SESSION_KEY) === 'true') {
    mostrarAplicativo();
  }
};

function doLogin() {
  const input = document.getElementById('pwInput').value;
  if (input === PASSWORD_CORRECTA) {
    localStorage.setItem(SESSION_KEY, 'true');
    mostrarAplicativo();
  } else {
    const err = document.getElementById('loginError');
    err.textContent = "❌ Contraseña incorrecta";
    setTimeout(() => { err.textContent = ""; }, 2500);
  }
}

function mostrarAplicativo() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initComponentes();
}

function initComponentes() {
  crearSelectorNum('bPicker', false);
  crearSelectorNum('bPickerD', true);
  obtenerConfiguracionGAS();
  renderHistorialLocal();
  actualizarContadores();
}

function actualizarContadores() {
  const sum = localHistorial.reduce((a, b) => a + (parseInt(b.bols) || 0), 0);
  document.getElementById('totalBolsonesHoy').textContent = sum;
  document.getElementById('misRegistros').textContent = localHistorial.length;
}

function entrarPuesto(puesto) {
  puestoActual = puesto;
  resetFormulario();
  document.getElementById('screenSelector').style.display = 'none';
  document.getElementById('screenForm').style.display = 'block';
  
  const hTitle = document.getElementById('headerTitle');
  const hPuesto = document.getElementById('headerPuesto');
  const btnB = document.getElementById('btnBack');

  hPuesto.style.visibility = 'visible';
  btnB.classList.add('visible');

  if (puesto === 'muelle') { hTitle.textContent = "🚢 MUELLE"; hPuesto.textContent = "MUELLE"; }
  else if (puesto === 'labarthe') { hTitle.textContent = "🏭 LABARTHE"; hPuesto.textContent = "LABARTHE"; }
  else { hTitle.textContent = "🚛 DESPACHO"; hPuesto.textContent = "DESPACHO"; }

  document.getElementById('formDescarga').style.display = puesto !== 'despacho' ? 'block' : 'none';
  document.getElementById('formDespacho').style.display = puesto === 'despacho' ? 'block' : 'none';

  if (puesto === 'despacho') { renderConductoresUI(); }
  renderFotosGrid();
}

function volverSelector() {
  puestoActual = null;
  document.getElementById('screenSelector').style.display = 'block';
  document.getElementById('screenForm').style.display = 'none';
  document.getElementById('screenHistorial').style.display = 'none';
  document.getElementById('headerTitle').textContent = "📦 IQBF Control";
  document.getElementById('headerPuesto').style.visibility = 'hidden';
  document.getElementById('btnBack').classList.remove('visible');
  changeTab('form');
}

function changeTab(tab) {
  if (tab === 'form') {
    document.getElementById('screenForm').style.display = puestoActual ? 'block' : 'none';
    document.getElementById('screenSelector').style.display = !puestoActual ? 'block' : 'none';
    document.getElementById('screenHistorial').style.display = 'none';
    document.getElementById('bnavReg').classList.add('active');
    document.getElementById('bnavHist').classList.remove('active');
  } else {
    document.getElementById('screenForm').style.display = 'none';
    document.getElementById('screenSelector').style.display = 'none';
    document.getElementById('screenHistorial').style.display = 'block';
    document.getElementById('bnavReg').classList.remove('active');
    document.getElementById('bnavHist').classList.add('active');
    renderHistorialLocal();
  }
}

function crearSelectorNum(id, isD) {
  const container = document.getElementById(id);
  container.innerHTML = "";
  for (let i = 1; i <= 30; i++) {
    const btn = document.createElement('div');
    btn.className = "bols-num";
    btn.textContent = i;
    btn.onclick = () => selectBolsones(i, id, isD);
    container.appendChild(btn);
  }
}

function selectBolsones(n, id, isD) {
  bolsonesSeleccionados = n;
  const display = document.getElementById(isD ? 'bolsDisplayD' : 'bolsDisplay');
  display.textContent = `${n} BOLSONES`;
  document.querySelectorAll(`#${id} .bols-num`).forEach(el => {
    el.classList.toggle('sel', parseInt(el.textContent) === n);
  });
}

function obtenerConfiguracionGAS() {
  fetch(`${GAS_URL}?action=obtenerProductos`)
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        // Adaptación técnica segura: Mapea la lista de objetos a texto simple para el celular
        productosDisponibles = data.productos.map(p => typeof p === 'object' ? p.producto : p);
      }
      renderProductosUI();
    });

  fetch(`${GAS_URL}?action=obtenerConductores`)
    .then(r => r.json())
    .then(data => {
      if (data.ok) conductoresDisponibles = data.conductores;
    });
}

function renderProductosUI() {
  ['prodGrid', 'prodGridD'].forEach(gridId => {
    const grid = document.getElementById(gridId);
    grid.innerHTML = "";
    productosDisponibles.forEach(prod => {
      const b = document.createElement('button');
      b.className = "prod-btn";
      b.textContent = prod;
      b.type = "button";
      b.onclick = () => {
        const i = productosSeleccionados.indexOf(prod);
        if (i > -1) { productosSeleccionados.splice(i, 1); b.classList.remove('sel'); }
        else { productosSeleccionados.push(prod); b.classList.add('sel'); }
      };
      grid.appendChild(b);
    });
  });
}

function renderConductoresUI() {
  const list = document.getElementById('listaConductores');
  list.innerHTML = "";
  conductoresDisponibles.forEach((c, idx) => {
    const item = document.createElement('div');
    item.className = "conductor-item";
    item.innerHTML = `<div class="conductor-name">👤 ${c.nombre}</div><div class="conductor-placa">Placa: ${c.placa}</div>`;
    item.onclick = () => {
      conductorSeleccionado = c;
      document.querySelectorAll('.conductor-item').forEach(el => el.classList.remove('selected'));
      item.classList.add('selected');
      document.getElementById('despachoCampos').style.display = 'block';
    };
    list.appendChild(item);
  });
}

function renderFotosGrid() {
  const isD = puestoActual === 'despacho';
  const grid = document.getElementById(isD ? 'fotoGridD' : 'fotoGrid');
  const inputs = document.getElementById(isD ? 'hiddenInputsD' : 'hiddenInputs');
  grid.innerHTML = "";
  inputs.innerHTML = "";

  fotosList.forEach((src, idx) => {
    const slot = document.createElement('div');
    slot.className = "foto-slot has-photo";
    slot.innerHTML = `<img src="${src}"><span class="foto-label">Foto ${idx+1}</span><button class="btn-del-foto" onclick="eliminarFoto(${idx})">✕</button>`;
    grid.appendChild(slot);
  });

  const maxFotos = puestoActual === 'despacho' ? 6 : 2;
  if (fotosList.length < maxFotos) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.id = `foto_input_${fotosList.length}`;
    input.onchange = (e) => procesarFotoYComprimir(e);
    inputs.appendChild(input);

    const slot = document.createElement('label');
    slot.className = "foto-slot";
    slot.setAttribute('for', input.id);
    slot.innerHTML = `<span style="font-size:2.5rem;">📸</span><span class="foto-label">Tomar foto</span>`;
    grid.appendChild(slot);
  }
}

function procesarFotoYComprimir(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.src = e.target.result;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_SIZE = 800; 
      let w = img.width;
      let h = img.height;

      if (w > h && w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; }
      else if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const b64 = canvas.toDataURL('image/jpeg', 0.5);
      fotosList.push(b64);
      renderFotosGrid();
    };
  };
  reader.readAsDataURL(file);
}

function eliminarFoto(idx) {
  fotosList.splice(idx, 1);
  renderFotosGrid();
}

function abrirConfirmacion() {
  const isD = puestoActual === 'despacho';
  const numTT = !isD ? document.getElementById('numTT').value.trim() : '';

  if (!isD && !numTT) { showToast('⚠️ Digite el número de TT', true); return; }
  if (isD && !conductorSeleccionado) { showToast('⚠️ Seleccione un conductor', true); return; }
  if (bolsonesSeleccionados === 0) { showToast('⚠️ Seleccione los bolsones', true); return; }
  if (productosSeleccionados.length === 0) { showToast('⚠️ Seleccione el producto', true); return; }
  
  const minFotos = isD ? 4 : 2; 
  if (fotosList.length < minFotos) {
    showToast(`⚠️ Requiere mínimo ${minFotos} fotos de evidencia`, true);
    return;
  }

  const rows = [
    ['PUESTO', puestoActual.toUpperCase()],
    isD ? ['CONDUCTOR', conductorSeleccionado.nombre] : ['TT', `TT-${numTT}`],
    ['BOLSONES', `${bolsonesSeleccionados} Bolsones`],
    ['PRODUCTO', productosSeleccionados.join(', ')],
    ['EVIDENCIAS', `${fotosList.length} Foto(s)`]
  ];

  document.getElementById('confirmBody').innerHTML = rows.map(([l, v]) => `
    <div class="confirm-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>
  `).join('');

  document.getElementById('modalConfirm').classList.add('open');
}

function cerrarConfirmacion() {
  document.getElementById('modalConfirm').classList.remove('open');
}

async function guardarDatosFinal() {
  cerrarConfirmacion();
  const isD = puestoActual === 'despacho';
  const numTT = !isD ? document.getElementById('numTT').value.trim() : '';
  
  const btn = document.getElementById(isD ? 'btnGuardarD' : 'btnGuardar');
  btn.disabled = true;
  btn.textContent = "⏱️ ENVIANDO REGISTRO...";

  const now = new Date();
  const fechaHora = now.toLocaleDateString('es-PE', {day:'2-digit', month:'2-digit', year:'numeric'}) + ' ' + now.toLocaleTimeString('es-PE', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

  const payload = {
    action: isD ? 'registroDespacho' : 'registroDescarga',
    data: {
      puesto: puestoActual,
      tt: isD ? conductorSeleccionado.placa : `TT-${numTT}`,
      bolsones: bolsonesSeleccionados,
      conductor: isD ? conductorSeleccionado.nombre : '—',
      productos: productosSeleccionados.join(', '),
      fechaHora: fechaHora,
      fotosBase64: fotosList
    }
  };

  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();

    if (result.ok) {
      const itemHist = {
        viajeId: result.viajeId,
        tt: payload.data.tt,
        bols: bolsonesSeleccionados,
        puesto: puestoActual,
        fechaHora: fechaHora,
        productos: payload.data.productos
      };
      localHistorial.unshift(itemHist);
      localStorage.setItem('iqbf_historial_agente', JSON.stringify(localHistorial));
      
      showToast('✅ REGISTRO GUARDADO CON ÉXITO');
      resetFormulario();
      actualizarContadores();
    } else {
      showToast('❌ Error al subir: ' + result.error, true);
    }
  } catch(e) {
    showToast('❌ Error de red/conexión', true);
  }

  btn.disabled = false;
  btn.textContent = "REVISAR Y GUARDAR";
}

function resetFormulario() {
  const t = document.getElementById('numTT');
  if (t) t.value = "";
  bolsonesSeleccionados = 0;
  productosSeleccionados = [];
  fotosList = [];
  conductorSeleccionado = null;

  document.querySelectorAll('.bols-num').forEach(el => el.classList.remove('sel'));
  document.getElementById('bolsDisplay').textContent = "—";
  document.getElementById('bolsDisplayD').textContent = "—";
  
  renderProductosUI();
  renderFotosGrid();
  
  document.getElementById('despachoCampos').style.display = 'none';
  document.querySelectorAll('.conductor-item').forEach(el => el.classList.remove('selected'));
}

function renderHistorialLocal() {
  const container = document.getElementById('listaHistorial');
  if (localHistorial.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:3rem;font-size:1.3rem;color:var(--muted)">Sin registros locales hoy</div>';
    return;
  }
  container.innerHTML = localHistorial.map(r => `
    <div class="hist-item">
      <div class="hist-row">
        <span class="hist-tt">🚛 ${r.tt}</span>
        <span class="hist-qty">${r.bols} 📦</span>
      </div>
      <div class="hist-meta">${r.fechaHora} · ${r.puesto.toUpperCase()}</div>
      <div style="font-size:1.1rem;font-weight:bold;margin-top:0.3rem">🧴 ${r.productos}</div>
      <div class="hist-meta" style="margin-top:0.2rem;font-size:0.9rem">ID: ${r.viajeId}</div>
    </div>
  `).join('');
}

function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { toast.className = 'toast'; }, 3000);
}
</script>
