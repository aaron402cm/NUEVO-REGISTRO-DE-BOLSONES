<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IQBF — Sistema de Control de Bolsones</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    padding: 2rem;
  }
  .container { text-align: center; max-width: 420px; width: 100%; }
  .logo { font-size: 5rem; margin-bottom: 1rem; }
  h1 { color: white; font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem; }
  p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 2.5rem; font-weight: bold; }
  .btn {
    display: block;
    width: 100%;
    padding: 1.5rem;
    border-radius: 16px;
    border: none;
    font-size: 1.3rem;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 1.2rem;
    transition: transform 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-registro { 
    background: white; 
    color: #0f172a; 
    border: 3px solid #cbd5e1;
  }
  .btn-cctv { 
    background: #0284c7; 
    color: white; 
    border-bottom: 5px solid #0369a1;
  }
  .sub { font-size: 0.95rem; opacity: 0.8; margin-top: 0.3rem; font-weight: bold; }
  .footer { color: #475569; font-size: 0.85rem; margin-top: 3rem; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">📦</div>
  <h1>Control IQBF</h1>
  <p>Monitoreo de Bolsones en Tiempo Real</p>

  <a class="btn btn-registro" href="registro.html">
    📱 Aplicación de Registro
    <div class="sub">Muelle · Labarthe · Despacho</div>
  </a>

  <a class="btn btn-cctv" href="panel_cctv.html">
    🎛️ Panel CCTV Monitoreo
    <div class="sub">Control de Seguridad y Alertas</div>
  </a>

  <div class="footer">APM 2026 · Puerto de Operaciones</div>
</div>
</body>
</html>
